# Render Blueprint — Affiliate Engine (free tier)
# Flat layout: the .py files sit at the repo root, so the app is `server:app`.
services:
  - type: web
    name: affiliate-engine
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: POSTBACK_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
